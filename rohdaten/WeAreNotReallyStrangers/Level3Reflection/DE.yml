1: "Mit einem Wort, wie würdest du unser Gespräch beschreiben?"
2: "Wildcard: Mach deinem Partner ein Kompliment, von dem du glaubst, dass er es nicht oft genug hört."
3: "Wildcard: Gib etwas zu."
4: "Was empfiehlst du mir loszulassen, wenn überhaupt etwas?"
5: "Wie verdient man sich deine Verletzlichkeit? Habe ich sie mir verdient? Wie kann ich mir mehr davon verdienen?"
6: "Was glaubst du, ist meine Schwäche?"
7: "Wobei kann ich dir helfen?"
8: "Was an mir hat dich am meisten überrascht?"
9: "Wildcard: Spielt eine Runde Schere, Stein, Papier. Der Gewinner kann seinen Partner alles fragen. Der Verlierer muss antworten."
10: "Wildcard - beide Spieler: Schreibt eine Sache auf, die ihr dieses Jahr loslassen wollt. Lest sie laut vor und zerreißt sie dann gemeinsam."
11: "Wildcard - beide Spieler: Schreibt ein Ziel für dieses Jahr auf. Faltet es & tauscht es aus. Haltet euch gegenseitig dafür verantwortlich."
12: "Wenn wir in einer Band wären, wie würde sie heißen?"
13: "Was ist deiner Meinung nach unsere wichtigste Gemeinsamkeit?"
14: "Wildcard: Gebt euch gegenseitig Spitznamen!"
15: "Glaubst du, dass jeder eine Berufung hat? Wenn ja, glaubst du, dass ich meine gefunden habe?"
16: "Wenn dieses Spiel vorbei ist, woran wirst du dich über mich erinnern?"
17: "Wann in diesem Spiel hast du dich mir am meisten verbunden gefühlt?"
18: "Wildcard - beide Spieler: Fordert euren Partner dazu heraus, in der nächsten Woche etwas außerhalb seiner Komfortzone zu tun."
19: "Vor welcher Frage hattest du am meisten Angst, sie zu beantworten?"
20: "Wildcard: Macht zusammen ein Selfie."
21: "Wildcard: Scrollt durch die Instagram-Profile des jeweils anderen. Findet das Bild, von dem ihr findet, dass es das Wesen eures Partners am besten repräsentiert, und kommentiert, warum ihr dieses Bild gewählt habt."
22: "Basierend auf dem, was du über mich erfahren hast, welches Buch würdest du mir empfehlen zu lesen?"
23: "Wie würdest du mich einem Fremden beschreiben?"
24: "Was bewunderst du am meisten an mir?"
25: "Was sollte ich deiner Meinung nach über mich selbst wissen, dessen ich mir vielleicht nicht bewusst bin?"
26: "Warum glaubst du, haben wir uns getroffen?"
27: "Wildcard - beide Spieler: Schreibt in 30 Sekunden ein Lied über euren Partner. Singt es dann laut. Legt euch ins Zeug!"
28: "Welche meiner Antworten hat dich zum Strahlen gebracht?"
29: "Wie ergänzen sich unsere Persönlichkeiten?"
30: "Was glaubst du, ist meine Superkraft?"
31: "Was wäre das perfekte Geschenk für mich?"
