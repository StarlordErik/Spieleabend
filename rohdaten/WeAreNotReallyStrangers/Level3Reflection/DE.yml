33: "Welche Teile von dir selbst siehst du in mir?"
34: "Was muss ich gerade hören?"
35: "Wildcard - beide Spieler: Tauscht einen Songvorschlag aus, der eurem Partner gefallen könnte."
36: "Wildcard: Erstelle deine eigene Frage. Sorge dafür, dass sie zählt."
37: "Basierend auf dem, was du über mich erfahren hast, spiegeln meine sozialen Medien genau wider, wer ich bin? Warum oder warum nicht?"
38: "Wildcard: Beide Spieler teilen etwas, wofür sie in diesem Moment am dankbarsten sind."
39: "Beschreibe mit einem Wort, wie du dich gerade fühlst."
40: "Wildcard: Umarme deinen Partner. Nicht auf die beschissene Art. Eine warme, flauschige Umarmung."
41: "Welche Lektion wirst du aus unserem Gespräch mitnehmen?"
42: "Basierend auf dem, was du über mich weißt, hast du irgendwelche Netflix-Empfehlungen?"
43: "Was an mir ist für dich am schwierigsten zu verstehen?"
44: "Worüber bin ich am qualifiziertesten, Ratschläge zu geben?"
45: "Wenn du mir eine Sache verschreiben könntest, die ich für den Rest dieses Monats tun soll, was wäre es und warum?"
46: "Wildcard: Beide Spieler schreiben ihrem jüngeren Ich in 1 Minute eine Notiz. Möglichkeit zum Vergleichen."
47: "Was glaubst du, ist meine prägende Eigenschaft?"
48: "Was glaubst du, fürchte ich am meisten?"
49: "Was können wir gemeinsam erschaffen?"
50: "Was würde dich mir näher fühlen lassen?"
