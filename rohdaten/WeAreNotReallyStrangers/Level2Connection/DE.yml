1: "Beschreibe deinen perfekten Tag!"
2: "Erinnerung: Sei mehr daran interessiert, andere zu verstehen, als selbst verstanden zu werden."
3: "Belügst du dich selbst in Bezug auf irgendetwas?"
4: "Gibt es ein Gefühl, das du vermisst?"
5: "Was ist ein Traum, den du losgelassen hast?"
6: "Wildcard: Gib etwas zu."
7: "Wildcard: Erfindet einen geheimen Handschlag!"
8: "Hast du jemals jemandem gesagt: \"Ich liebe dich\", ohne es so zu meinen? Wenn ja, warum?"
9: "Vermisst du gerade jemanden? Glaubst du, dass diese Person dich auch vermisst?"
10: "Wildcard: Anstarr-Wettbewerb. Wer zuerst blinzelt, muss ein persönliches Problem offenbaren und den Partner um Rat fragen, wie er damit umgehen würde."
11: "Wildcard: Beide Spieler schreiben eine peinliche, lustige Tatsache über sich selbst auf. Spielt eine Runde Schere, Stein, Papier. Der Verlierer muss sie offenbaren!"
12: "Wie heißt deine Mutter? Und was ist das Schönste an ihr?"
13: "Glaubst du, dass das Bild, das du von dir selbst hast, damit übereinstimmt, wie andere Menschen dich sehen?"
14: "Wie heißt dein Vater? Und erzähl mir eine Sache über ihn."
15: "Wenn du einen Moment hattest, in dem dir klar wurde, dass du nicht unverwundbar bist, wann war das?"
16: "Wie kannst du ein besserer Mensch werden?"
17: "Wenn du jemanden in deinem Leben auf einer tieferen Ebene kennenlernen könntest, wer wäre es und warum?"
18: "Wie würdest du das Gefühl, verliebt zu sein, mit einem Wort beschreiben?"
19: "Was war der größte Schmerz, den du je erlebt hast und der nicht körperlich war?"
20: "Was war deine glücklichste Erinnerung im vergangenen Jahr?"
21: "Wie heißt deine erste Liebe und was war der Grund, warum du dich in ihn/sie verliebt hast?"
22: "Wonach verlangst du mehr?"
23: "Was würde dein jüngeres Ich über dein heutiges Leben nicht glauben?"
24: "Wildcard - beide Spieler: Schreibt die drei Dinge auf, die euch im Leben am wichtigsten sind. Vergleicht nach 30 Sekunden."
25: "Wildcard - beide Spieler: Zeichnet eure aktuelle Stimmung. Vergleicht dann."
26: "Was ist etwas, das du an dir selbst nicht verändern wollen würdest?"
27: "Wildcard: Fragen sind eine Kunstform. Erstelle deine eigene Frage."
28: "Wann hast du dich das letzte Mal selbst überrascht?"
29: "Wenn du gefragt wirst: \"Wie geht es dir?\", wie oft antwortest du ehrlich?"
30: "Hast du in letzter Zeit deine Meinung über etwas geändert?"
31: "Wie geht es dir wirklich?"
32: "Hat ein Fremder jemals dein Leben verändert?"
33: "Was war das beste Kompliment, das dir je ein Fremder gemacht hat?"
34: "Welches Kompliment würdest du dir wünschen, häufiger zu bekommen?"
35: "Welchen Titel würdest du diesem Kapitel deines Lebens geben?"
36: "Wildcard: Drücke in deiner Musikbibliothek auf Zufallswiedergabe. Erkläre den ersten Song, der kommt."
37: "Welcher Teil deines Lebens funktioniert? Welcher Teil deines Lebens tut weh?"
38: "Wildcard: Ruf jemanden an, den du bewunderst, und sag der Person, warum du sie schätzt! (auf Lautsprecher stellen)"
39: "Wildcard: Zeige das erste Foto in deiner Kamerarolle. Erkläre."
40: "Wildcard: Tausche mit deinem Partner die Plätze."
41: "Wildcard: Singe den Refrain deines absoluten Lieblingssongs. Leg dich ins Zeug!"
42: "Wenn du es dir aussuchen könntest: Mit wem wärst du zusammen? Wo wärst du? & Was würdest du tun?"
43: "Welche Lektion hat am längsten gebraucht, bis du sie verlernt hast?"
44: "Vervollständige die Sätze: Fremde würden mich als ___ beschreiben. Nur ich weiß, dass ich ___ bin."
45: "Was ist das Unerklärlichste, das dir jemals passiert ist?"
46: "Was ist das Letzte, worüber du deine Mutter angelogen hast?"
47: "Was versuchst du dir selbst immer noch zu beweisen?"
48: "Wovor hast du mehr Angst, vor Misserfolg oder Erfolg? Und warum?"
49: "Wildcard - beide Spieler: Denkt an etwas, das ihr überhaupt nicht mögt, das die meisten Menschen lieben. Sagt es bei drei laut!"
50: "Welche Fragen versuchst du gerade in deinem Leben am meisten zu beantworten?"
51: "Was ist deine früheste Erinnerung an Glück?"
52: "Wildcard: Stelle eine Frage, die du dich zu stellen zu sehr fürchten würdest. Etwas, das du dich nicht zu fragen trauen würdest."
53: "Letzte Karte des Stapels: Jeder Spieler schreibt dem anderen eine Nachricht. Faltet sie und tauscht sie aus. Öffnet sie erst, wenn ihr beide auseinandergegangen seid."
